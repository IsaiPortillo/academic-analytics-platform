# Configuración de la app Streamlit de dashboard/ (SCRUM-44).
# Streamlit lee este archivo del directorio desde el que se lanza, por eso vive
# en la raíz del proyecto:   streamlit run dashboard/app.py

[server]
# Solo accesible desde esta máquina. La app NO tiene inicio de sesión propio: publicada,
# queda detrás de nginx con la sesión de la app web (deploy/, README). Nunca se expone sola.
address = "127.0.0.1"
port = 8501
headless = true

[client]
# Sin el botón "Deploy" ni opciones de publicación: es una app de consulta.
toolbarMode = "minimal"

[browser]
# Sin telemetría de uso hacia Streamlit.
gatherUsageStats = false

# Misma identidad que la app web (DESIGN.md): carmesí institucional sobre superficies
# frías, en claro y en oscuro. La tipografía y el resto del marco los pone dashboard/tema.py.
[theme]
baseRadius = "12px"
borderColor = "#e2e8f0"

[theme.light]
primaryColor = "#8b0000"
backgroundColor = "#f7f9fb"
secondaryBackgroundColor = "#eef2f6"
textColor = "#0f172a"
borderColor = "#e2e8f0"

[theme.dark]
primaryColor = "#c73838"
backgroundColor = "#0b1220"
secondaryBackgroundColor = "#0f1626"
textColor = "#e7ebf3"
borderColor = "#253046"
