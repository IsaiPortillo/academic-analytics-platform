<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block titulo %}Gestión Académica{% endblock %}</title>
    <link href="{{ url_for('static', path='/app.css') }}" rel="stylesheet">
</head>
<body>

{% if usuario %}
<nav class="navbar">
    <div class="mx-auto max-w-6xl px-4 py-3">
        <div class="flex items-center justify-between gap-4">
            <a class="navbar-brand" href="/">
                Gestión Académica <span class="navbar-suffix">| UES-FMO</span>
            </a>

            <button id="navToggle" type="button" aria-label="Abrir menú" aria-controls="navMenu"
                    class="md:hidden inline-flex items-center justify-center rounded-md p-2 text-white/85 hover:bg-white/10">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                    <path fill-rule="evenodd" clip-rule="evenodd"
                          d="M3 5a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm0 5a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm1 4a1 1 0 100 2h12a1 1 0 100-2H4z" />
                </svg>
            </button>

            <div id="navMenu" class="hidden md:flex md:items-center md:gap-4 w-full md:w-auto">
                <div class="flex flex-col md:flex-row md:items-center gap-1 mt-2 md:mt-0 md:mr-auto">
                    {% if usuario.es_coordinador %}
                    <a class="nav-link" href="/matricula">Matrícula</a>
                    {% endif %}
                    <a class="nav-link" href="/calificaciones">Calificaciones</a>
                    <a class="nav-link" href="/asistencia">Asistencia</a>
                    {% if usuario.es_coordinador %}
                    <a class="nav-link" href="/reportes">Reportes</a>
                    {% endif %}
                </div>

                <div class="flex items-center gap-3 py-2 md:py-0 mt-2 md:mt-0 border-t border-white/10 md:border-0">
                    <span class="text-sm text-white/60">
                        {{ usuario.nombre_completo }}
                        <span class="badge badge-secondary ml-1">{{ usuario.rol_legible }}</span>
                    </span>
                    <a href="/logout" class="btn-nav-action">Salir</a>
                </div>
            </div>
        </div>
    </div>
</nav>
{% endif %}

<main class="mx-auto max-w-6xl px-4 py-6">
    {% block contenido %}{% endblock %}
</main>

<script src="{{ url_for('static', path='/app.js') }}"></script>
<!-- impeccable-live-start -->
<script src="http://localhost:8400/live.js?token=f2025ba8-1753-48ee-bd3f-0d728d323cd2"></script>
<!-- impeccable-live-end -->
</body>
</html>
