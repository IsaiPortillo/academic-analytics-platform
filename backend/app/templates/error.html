{% extends "base.html" %}
{% block titulo %}Error {{ codigo }}{% endblock %}

{% macro cuerpo() %}
<div class="flex justify-center">
    <div class="w-full max-w-md py-16 text-center">
        <div class="stat-number text-5xl" style="color: var(--color-muted);">{{ codigo }}</div>
        <p class="mt-3 text-lg">{{ mensaje }}</p>
        <a href="/" class="btn-outline-neutral inline-block mt-4">Volver al inicio</a>
    </div>
</div>
{% endmacro %}

{% block contenido %}{{ cuerpo() }}{% endblock %}
{% block contenido_publico %}{{ cuerpo() }}{% endblock %}
