{% extends "base.html" %}
{% block titulo %}Iniciar sesión{% endblock %}

{% block contenido %}
<div class="flex justify-center">
    <div class="w-full max-w-sm">

        <div class="text-center mb-4 mt-8">
            <h1 class="text-xl font-medium">Gestión Académica</h1>
            <p class="text-sm text-quiet-gray mt-1">
                Universidad de El Salvador — Facultad Multidisciplinaria Oriental
            </p>
        </div>

        <div class="card">
            <div class="card-body">
                {% if error %}
                <div class="alert alert-danger mb-4" role="alert">{{ error }}</div>
                {% endif %}

                <form method="post" action="/login">
                    <div class="mb-3">
                        <label for="username" class="field-label">Usuario</label>
                        <input type="text" class="input" id="username" name="username"
                               required autofocus autocomplete="username">
                    </div>
                    <div class="mb-4">
                        <label for="password" class="field-label">Contraseña</label>
                        <input type="password" class="input" id="password" name="password"
                               required autocomplete="current-password">
                    </div>
                    <button type="submit" class="btn-login w-full">Ingresar</button>
                </form>
            </div>
        </div>

    </div>
</div>
{% endblock %}
