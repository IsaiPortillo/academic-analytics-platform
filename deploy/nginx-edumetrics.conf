# =============================================================================
# nginx — vhost de Sistema Minerva con el dashboard de Streamlit detrás del login
# =============================================================================
# Copiar a /etc/nginx/sites-enabled/ (o a sites-available + enlace simbólico). Un
# solo archivo por dominio: nginx carga TODO lo que haya en sites-enabled/, incluso
# un respaldo con otra extensión (dos `default_server` en el 80 impiden arrancar).
#
# Cómo se reparte el tráfico:
#   /              -> la app web (FastAPI) en 127.0.0.1:8000
#   /analitica/    -> el dashboard de Streamlit en 127.0.0.1:8501, SOLO si la sesión
#                     de la app web es de un coordinador (auth_request)
#
# El dashboard no tiene login propio y nunca debe quedar publicado sin esto: lee el
# Data Warehouse con su propio rol de solo lectura, pero muestra datos institucionales.
# Escucha solo en 127.0.0.1; nginx es la única puerta.
#
# -----------------------------------------------------------------------------
# Cifrado de punta a punta (Cloudflare en modo «Full (strict)»)
# -----------------------------------------------------------------------------
# El visitante habla con Cloudflare por HTTPS y Cloudflare habla con este nginx
# también por HTTPS, validando el certificado de origen. En modo «Flexible» ese
# segundo tramo iba en texto plano, y el servidor respondía además por HTTP en su
# IP pública: quien entrara directo por la IP enviaba la contraseña sin cifrar.
#
# Pasos (una sola vez):
#   1. Cloudflare > SSL/TLS > Origin Server > Create Certificate (15 años).
#      Guardar el certificado en /etc/ssl/certs/edumetrics-origin.pem y la clave en
#      /etc/ssl/private/edumetrics-origin.key (chmod 600, dueño root).
#   2. Copiar deploy/nginx-minerva-http.conf a /etc/nginx/conf.d/minerva.conf
#      (IP real del visitante, rangos de Cloudflare y límite de /login).
#   3. nginx -t && systemctl reload nginx
#   4. Cloudflare > SSL/TLS > Overview > «Full (strict)». Activar también
#      «Always Use HTTPS».
#   5. COOKIE_SECURE=true en el .env y reiniciar academico-web.
#   6. Cortafuegos: que 80/443 solo acepten a Cloudflare también a nivel de red
#      (más abajo, «Cortafuegos»). nginx ya lo hace, pero conviene en las dos capas.
#
# Con esto, quien entre por la IP pública recibe una conexión cerrada (444 /
# saludo TLS rechazado) y quien no venga de Cloudflare tampoco llega a la app.
# =============================================================================

# -----------------------------------------------------------------------------
# Cortafuegos (además de nginx): 80/443 solo desde Cloudflare
# -----------------------------------------------------------------------------
#   for r in $(curl -s https://www.cloudflare.com/ips-v4) $(curl -s https://www.cloudflare.com/ips-v6); do
#       ufw allow proto tcp from "$r" to any port 80,443
#   done
#   ufw delete allow 80/tcp; ufw delete allow 443/tcp; ufw delete allow 'Nginx Full'
# (En Oracle Cloud la lista de seguridad de la VCN también debe dejar 443 abierto.)

# -----------------------------------------------------------------------------
# Peticiones que no son para el dominio (p. ej. por la IP pública): se cierran.
# -----------------------------------------------------------------------------
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    return 444;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    # Con nginx >= 1.19.4 basta `ssl_reject_handshake on;` en lugar del certificado.
    ssl_certificate     /etc/ssl/certs/edumetrics-origin.pem;
    ssl_certificate_key /etc/ssl/private/edumetrics-origin.key;
    return 444;
}

# -----------------------------------------------------------------------------
# HTTP del dominio: solo redirige a HTTPS. No sirve nada en claro.
# -----------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name edumetrics.tech www.edumetrics.tech;

    if ($desde_cloudflare = 0) {
        return 444;
    }
    return 301 https://edumetrics.tech$request_uri;
}

# -----------------------------------------------------------------------------
# HTTPS del dominio
# -----------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name edumetrics.tech www.edumetrics.tech;

    ssl_certificate     /etc/ssl/certs/edumetrics-origin.pem;
    ssl_certificate_key /etc/ssl/private/edumetrics-origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Opcional, más estricto: «Authenticated Origin Pulls». Cloudflare presenta un
    # certificado de cliente y nginx rechaza cualquier conexión que no lo traiga.
    # Activarlo en Cloudflare > SSL/TLS > Origin Server y descargar su CA:
    #   ssl_client_certificate /etc/ssl/certs/cloudflare-origin-pull-ca.pem;
    #   ssl_verify_client on;

    # Solo Cloudflare: quien llegue directo a este puerto no pasa.
    if ($desde_cloudflare = 0) {
        return 444;
    }

    add_header Strict-Transport-Security "max-age=31536000" always;

    access_log /var/log/nginx/edumetrics_access.log;
    error_log  /var/log/nginx/edumetrics_error.log warn;

    # -------------------------------------------------------------------------
    # Comprobación de sesión: la app web responde 204 (coordinador), 401 (sin
    # sesión) o 403 (otro rol). Va por la misma cookie de sesión que el resto del
    # sistema: no hay una segunda contraseña ni una segunda lista de usuarios.
    # -------------------------------------------------------------------------
    location = /_auth_coordinador {
        internal;
        proxy_pass http://127.0.0.1:8000/auth/verificar;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /analitica/ {
        auth_request /_auth_coordinador;
        # Quién es, para la barra superior del dashboard (solo informativo). proxy_set_header
        # REEMPLAZA lo que mande el cliente: no se puede falsificar desde el navegador.
        auth_request_set $minerva_usuario $upstream_http_x_minerva_usuario;
        auth_request_set $minerva_rol $upstream_http_x_minerva_rol;
        proxy_set_header X-Minerva-Usuario $minerva_usuario;
        proxy_set_header X-Minerva-Rol $minerva_rol;
        error_page 401 = @ir_a_login;
        error_page 403 = @sin_permiso;

        # Sin parte de URI: nginx pasa la ruta original (/analitica/...), que es la
        # que Streamlit espera con server.baseUrlPath=analitica.
        proxy_pass http://127.0.0.1:8501;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";   # Streamlit habla por WebSocket
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 86400;                # la sesión de Streamlit es un WebSocket largo
        proxy_buffering off;
    }

    location @ir_a_login {
        return 302 https://$host/login?siguiente=$uri;
    }

    location @sin_permiso {
        default_type text/plain;
        return 403 "Tu rol no tiene acceso a este módulo.";
    }

    # -------------------------------------------------------------------------
    # La aplicación web
    # -------------------------------------------------------------------------
    # X-Forwarded-For lleva SOLO la IP del visitante (ya resuelta por real_ip), no
    # la cadena que mande el cliente: uvicorn la usa como request.client y el
    # bloqueo de intentos de login cuenta por ella. Una cadena falsificable
    # permitiría esquivarlo cambiando la cabecera en cada intento.

    location = /login {
        limit_req zone=minerva_login burst=5 nodelay;

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    # La recarga del Data Warehouse reconstruye todo el modelo dimensional y tarda
    # unos 45 segundos con el volumen actual. El proxy_read_timeout por defecto de
    # nginx son 60, demasiado cerca: si se agota, el coordinador ve un 504 mientras
    # la carga termina igual por detras, que es el peor desenlace posible. El limite
    # de la aplicacion son 300 s (app/recarga.py), asi que aqui se deja un poco mas.
    location = /costos/recargar {
        proxy_pass http://127.0.0.1:8000;
        proxy_read_timeout 360;
        proxy_send_timeout 360;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
}
