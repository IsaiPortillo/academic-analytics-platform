# =============================================================================
# nginx — vhost de Sistema Minerva con el dashboard de Streamlit detrás del login
# =============================================================================
# Copiar a /etc/nginx/sites-enabled/ (o a sites-available + enlace simbólico). Un
# solo archivo por dominio: nginx carga TODO lo que haya en sites-enabled/, incluso
# un respaldo con otra extensión (dos `default_server` en el 80 impiden arrancar).
#
# Cómo se reparte el tráfico:
#   /              -> la app web (FastAPI) en 127.0.0.1:8000
#   /analitica/    -> el dashboard de Streamlit en 127.0.0.1:8501, SOLO si la sesión
#                     de la app web es de un coordinador (auth_request)
#
# El dashboard no tiene login propio y nunca debe quedar publicado sin esto: lee el
# Data Warehouse con su propio rol de solo lectura, pero muestra datos institucionales.
# Escucha solo en 127.0.0.1; nginx es la única puerta.
# =============================================================================

# El visitante habla con Cloudflare por HTTPS, pero Cloudflare habla con este nginx
# por HTTP (modo Flexible): $scheme vale siempre "http". La cabecera que pone
# Cloudflare dice cuál fue el esquema real del visitante.
# (Va fuera de server{}: map solo existe en el contexto http; sirve un archivo
#  /etc/nginx/conf.d/esquema.conf con solo estas cuatro líneas.)
#
#   map $http_x_forwarded_proto $esquema_publico {
#       default $scheme;
#       https   https;
#   }

server {
    listen 80 default_server;
    server_name edumetrics.tech www.edumetrics.tech 163.192.220.62;

    access_log /var/log/nginx/edumetrics_access.log;
    error_log  /var/log/nginx/edumetrics_error.log warn;

    # Visitante que llegó por http (según Cloudflare) -> https en el dominio principal.
    if ($http_x_forwarded_proto = "http") {
        return 301 https://edumetrics.tech$request_uri;
    }

    # -------------------------------------------------------------------------
    # Comprobación de sesión: la app web responde 204 (coordinador), 401 (sin
    # sesión) o 403 (otro rol). Va por la misma cookie de sesión que el resto del
    # sistema: no hay una segunda contraseña ni una segunda lista de usuarios.
    # -------------------------------------------------------------------------
    location = /_auth_coordinador {
        internal;
        proxy_pass http://127.0.0.1:8000/auth/verificar;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $esquema_publico;
    }

    location /analitica/ {
        auth_request /_auth_coordinador;
        # Quién es, para la barra superior del dashboard (solo informativo). proxy_set_header
        # REEMPLAZA lo que mande el cliente: no se puede falsificar desde el navegador.
        auth_request_set $minerva_usuario $upstream_http_x_minerva_usuario;
        auth_request_set $minerva_rol $upstream_http_x_minerva_rol;
        proxy_set_header X-Minerva-Usuario $minerva_usuario;
        proxy_set_header X-Minerva-Rol $minerva_rol;
        error_page 401 = @ir_a_login;
        error_page 403 = @sin_permiso;

        # Sin parte de URI: nginx pasa la ruta original (/analitica/...), que es la
        # que Streamlit espera con server.baseUrlPath=analitica.
        proxy_pass http://127.0.0.1:8501;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";   # Streamlit habla por WebSocket
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $esquema_publico;
        proxy_read_timeout 86400;                # la sesión de Streamlit es un WebSocket largo
        proxy_buffering off;
    }

    location @ir_a_login {
        # Con el esquema que usó el visitante (Cloudflare termina el TLS: aquí $scheme es http).
        return 302 $esquema_publico://$host/login?siguiente=$uri;
    }

    location @sin_permiso {
        default_type text/plain;
        return 403 "Tu rol no tiene acceso a este módulo.";
    }

    # -------------------------------------------------------------------------
    # La aplicación web
    # -------------------------------------------------------------------------
    # La recarga del Data Warehouse reconstruye todo el modelo dimensional y tarda
    # unos 45 segundos con el volumen actual. El proxy_read_timeout por defecto de
    # nginx son 60, demasiado cerca: si se agota, el coordinador ve un 504 mientras
    # la carga termina igual por detras, que es el peor desenlace posible. El limite
    # de la aplicacion son 300 s (app/recarga.py), asi que aqui se deja un poco mas.
    location = /costos/recargar {
        proxy_pass http://127.0.0.1:8000;
        proxy_read_timeout 360;
        proxy_send_timeout 360;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $esquema_publico;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $esquema_publico;
    }
}

# ---- Bloque 443: agrégalo cuando exista el certificado de origen de Cloudflare ----
# (el mismo reparto de arriba; solo cambian el listen, los certificados y que el
#  esquema es siempre https). Ver README, "Despliegue en un servidor".
#
# server {
#     listen 443 ssl http2;
#     server_name edumetrics.tech www.edumetrics.tech;
#     ssl_certificate     /etc/ssl/certs/edumetrics-origin.pem;
#     ssl_certificate_key /etc/ssl/private/edumetrics-origin.key;
#     ssl_protocols       TLSv1.2 TLSv1.3;
#     ... repetir los location de arriba con  proxy_set_header X-Forwarded-Proto https;
# }
