# =============================================================================
# nginx (contexto http) — Sistema Minerva
# =============================================================================
# Copiar a /etc/nginx/conf.d/minerva.conf. Define lo que el vhost
# (nginx-edumetrics.conf) usa y que solo puede declararse fuera de server{}:
# la IP real del visitante, quién es Cloudflare y la zona de límite de /login.
# Sin este archivo, `nginx -t` falla con «unknown variable $desde_cloudflare»:
# es a propósito, para que el vhost no quede publicado sin estas defensas.
# =============================================================================

# IP real del visitante: Cloudflare la manda en CF-Connecting-IP. Solo se cree
# esa cabecera si la conexión viene de un rango de Cloudflare.
# Rangos vigentes: https://www.cloudflare.com/ips/ (revisarlos de vez en cuando).
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;
# ¿La CONEXIÓN viene de Cloudflare? Se evalúa sobre $realip_remote_addr (la IP
# que abrió el socket), no sobre $remote_addr, que tras real_ip ya es la del
# visitante. Por eso no sirve allow/deny aquí: miraría la IP equivocada.
geo $realip_remote_addr $desde_cloudflare {
    default 0;
    173.245.48.0/20 1;  103.21.244.0/22 1;  103.22.200.0/22 1;  103.31.4.0/22 1;
    141.101.64.0/18 1;  108.162.192.0/18 1; 190.93.240.0/20 1;  188.114.96.0/20 1;
    197.234.240.0/22 1; 198.41.128.0/17 1;  162.158.0.0/15 1;   104.16.0.0/13 1;
    104.24.0.0/14 1;    172.64.0.0/13 1;    131.0.72.0/22 1;
    2400:cb00::/32 1;   2606:4700::/32 1;   2803:f800::/32 1;   2405:b500::/32 1;
    2405:8100::/32 1;   2a06:98c0::/29 1;   2c0f:f248::/32 1;
}
# Límite de intentos de inicio de sesión: 10 POST por minuto por IP del
# visitante, con ráfaga de 5. Solo cuenta los POST (con clave vacía, nginx no
# limita): ver la página de login no consume intentos. La aplicación además
# bloquea unos minutos tras 5 fallos (app/limite_login.py).
map $request_method $minerva_login_clave {
    POST    $binary_remote_addr;
    default "";
}
limit_req_zone $minerva_login_clave zone=minerva_login:10m rate=10r/m;
limit_req_status 429;
